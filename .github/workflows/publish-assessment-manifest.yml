name: Publish assessment manifest

"on":
  push:
    branches: [main]
    paths:
      - "assessments/**"
      - "references/**"
      - "schema/**"
      - "tool/build_manifest.py"
      - "manifest.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build manifest
        run: python tool/build_manifest.py
      - name: Commit updated manifest
        shell: bash
        run: |
          if git diff --quiet -- manifest.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update assessment manifest"
          git push
