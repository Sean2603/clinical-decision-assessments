name: Generate manifest manually

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-manifest:
    name: Generate and commit manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --upgrade jsonschema

      - name: Validate clinical content before manifest generation
        run: python tool/validate_content.py

      - name: Generate manifest
        run: python tool/sync_manifest.py --write

      - name: Validate generated manifest safety controls
        run: python tool/validate_manifest_safety.py

      - name: Confirm manifest is synchronised
        run: python tool/sync_manifest.py --check

      - name: Commit generated manifest
        shell: bash
        run: |
          if git diff --quiet -- manifest.json; then
            echo "manifest.json is already up to date; no commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json
          git commit -m "chore: regenerate clinical content manifest"
          git push origin "HEAD:${{ github.ref_name }}"
