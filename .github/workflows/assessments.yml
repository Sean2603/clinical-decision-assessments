name: Validate clinical content

"on":
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "assessments/**"
      - "guidelines/**"
      - "scoring_tools/**"
      - "blood_panels/**"
      - "references/**"
      - "categories/**"
      - "schema/**"
      - "tool/**"
      - "manifest.json"
      - "reference-usage.json"
      - ".github/workflows/assessments.yml"

  schedule:
    - cron: "17 6 * * 1"

  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate clinical content and generated artefacts
    runs-on: ubuntu-latest

    steps:
      - name: Download exact branch/PR head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Show validated commit
        shell: bash
        run: |
          echo "Validating commit $(git rev-parse HEAD)"
          echo "Branch/ref: $GITHUB_REF"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation package
        run: python -m pip install --upgrade jsonschema

      - name: Fetch main branch
        if: github.event_name == 'pull_request'
        run: git fetch origin main:refs/remotes/origin/main

      - name: Validate pull request clinical content changes
        if: github.event_name == 'pull_request'
        run: python tool/validate_content.py --base-ref origin/main

      - name: Validate repository clinical content
        if: github.event_name != 'pull_request'
        run: python tool/validate_content.py

      - name: Validate embedded clinical review metadata
        run: python tool/validate_clinical_reliability.py

      - name: Validate reference structure
        run: python tool/validate_references.py

      - name: Validate manifest safety controls
        run: python tool/validate_manifest_safety.py

      - name: Enforce current cited references
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python tool/validate_references.py --strict

      - name: Verify committed manifest is synchronised
        run: python tool/sync_manifest.py --check

      - name: Verify committed reference usage is generated correctly
        shell: bash
        run: |
          python tool/generate_reference_usage.py
          if ! git diff --exit-code -- reference-usage.json; then
            echo "reference-usage.json differs from the generated result. Publish through the CDM Content Manager."
            exit 1
          fi

      - name: Confirm validation did not modify source-controlled content
        shell: bash
        run: |
          if ! git diff --exit-code -- manifest.json assessments guidelines scoring_tools blood_panels references categories schema; then
            echo "Validation changed source-controlled clinical content. GitHub Actions is read-only; publish through the CDM Content Manager."
            exit 1
          fi

  weekly-reference-audit:
    name: Weekly reference audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation package
        run: python -m pip install --upgrade jsonschema

      - name: Audit review dates and statuses
        run: python tool/validate_references.py --strict
