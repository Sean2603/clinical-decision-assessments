name: Validate assessment content

"on":
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --upgrade jsonschema
      - name: Validate content
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path('.')
          manifest = json.loads((root/'manifest.json').read_text())
          schema = json.loads((root/'schema/assessment-schema.json').read_text())
          refs_doc = json.loads((root/'references/references.json').read_text())
          ref_ids = [r['id'] for r in refs_doc['references']]
          errors = []
          if len(ref_ids) != len(set(ref_ids)):
              errors.append('Duplicate reference IDs')
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          manifest_ids = []
          for entry in manifest['assessments']:
              manifest_ids.append(entry['id'])
              file = root/entry['file']
              data = json.loads(file.read_text())
              if data['id'] != entry['id'] or data['title'] != entry['title'] or data['version'] != entry['version']:
                  errors.append(f'{file}: manifest metadata mismatch')
              for err in validator.iter_errors(data):
                  loc = '.'.join(map(str, err.absolute_path))
                  errors.append(f'{file}:{loc}: {err.message}')
              used = set(data.get('references', []))
              for section in data.get('sections', []):
                  for item in section.get('items', []):
                      used.update(item.get('references', []))
                      used.update((item.get('imagingGuidance') or {}).get('references', []))
              unknown = used - set(ref_ids)
              if unknown:
                  errors.append(f'{file}: unknown references {sorted(unknown)}')
          if len(manifest_ids) != len(set(manifest_ids)):
              errors.append('Duplicate assessment IDs in manifest')
          if errors:
              print('\n'.join(f'ERROR: {e}' for e in errors)); sys.exit(1)
          print('Assessment content validation passed')
          PY
